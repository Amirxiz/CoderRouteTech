<!DOCTYPE html>
<html dir="ltr" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
            }
            
            body {
                display: flex;
                flex-direction: row;
            }
            
            :root {
                --armyBlack: #171616;
                --abacusDarkBlue: #28384a;
                --Midnight: #122030;
                --Space: #163150;
                --borderColor: #524F4F;
                --siteGrey: #beccd4;
                --char: #404040;
            }
            
            :root {
                --hoverArmyBlack: rgba(255, 255, 255, 0.08);
                --hoverAbacusDB: rgba(255, 255, 255, 0.06);
                --sourceCode: "Source Code Pro", monospace;
                --Roboto: "Roboto", sans-serif;
                --sourceSans: "Source Sans 3", sans-serif;
                --borderMain: 2px solid #524F4F;
            }
            
            .blackbar {
                background-color: var(--abacusDarkBlue);
                width: 25%;
                height: 100%;
            }
            
            #scrollpage {
                background-color: var(--Midnight);
                width: 100%;
                height: 100%;
                color: white;
                font-family: var(--Roboto);
            }

            img {
                width: 100px;
                height: 100px
            }
        </style>
    </head>
    <body>
        <div class="blackbar">
            
        </div>
        <div id="scrollpage">
            <h3 style="text-align: center;">G a m e  C h a n g e r</h3>
            <br>
            <img src="logo.png">
        </div>
        <div class="blackbar">
            
        </div>
    </body>
</html>
