        <script data-type="text/javascript">
            const codeEditor = document.getElementById("codepage");
            const voidElements = new Set([
                "area", "base", "br", "col", "embed", "hr", "img", "input",
                "link", "meta", "param", "source", "track", "wbr"
            ]);

            function closeTagAfterInsertion(insertedText) {
                if (!insertedText || !insertedText.endsWith(">")) {
                    return;
                }

                const caret = codeEditor.selectionStart;
                if (caret !== codeEditor.selectionEnd) {
                    return;
                }

                const textBeforeCaret = codeEditor.value.slice(0, caret);
                const completedClosingTag = textBeforeCaret.match(/<\/([a-z][a-z0-9:-]*)>$/i);
                if (completedClosingTag) {
                    const existingClosingTag = `</${completedClosingTag[1]}>`;
                    if (codeEditor.value.slice(caret, caret + existingClosingTag.length).toLowerCase() === existingClosingTag.toLowerCase()) {
                        const nextCaret = caret - completedClosingTag[0].length + existingClosingTag.length;
                        codeEditor.setRangeText("", caret - completedClosingTag[0].length, caret, "preserve");
                        codeEditor.setSelectionRange(nextCaret, nextCaret);
                        return;
                    }
                }

                const openingTag = textBeforeCaret.match(/<([a-z][a-z0-9:-]*)(?:\s[^<>]*)?>$/i);
                if (!openingTag || voidElements.has(openingTag[1].toLowerCase())) {
                    return;
                }

                const closingTag = `</${openingTag[1]}>`;
                if (codeEditor.value.slice(caret, caret + closingTag.length).toLowerCase() === closingTag.toLowerCase()) {
                    return;
                }

                codeEditor.setRangeText(closingTag, caret, caret, "end");
                codeEditor.setSelectionRange(caret, caret);
            }

            codeEditor.addEventListener("keydown", (event) => {
                if (event.key === "Tab" && !event.shiftKey) {
                    event.preventDefault();
                    codeEditor.setRangeText(
                        "    ",
                        codeEditor.selectionStart,
                        codeEditor.selectionEnd,
                        "end"
                    );
                    codeEditor.dispatchEvent(new Event("input", { bubbles: true }));
                    return;
                }
            });
        </script>

        <script data-type="text/javascript">
            const editor = document.getElementById("codepage");

            function getPageSource(code) {
                if (/<title(?:\s|>)/i.test(code)) {
                    return code;
                }

                if (/<head(?:\s[^>]*)?>/i.test(code)) {
                    return code.replace(
                        /<head(?:\s[^>]*)?>/i,
                        (headTag) => `${headTag}<title>New Webpage</title>`
                    );
                }

                if (/<html(?:\s[^>]*)?>/i.test(code)) {
                    return code.replace(
                        /<html(?:\s[^>]*)?>/i,
                        (htmlTag) => `${htmlTag}<head><title>New Webpage</title></head>`
                    );
                }

                return `<!DOCTYPE html><html><head><title>New Webpage</title></head><body>${code}</body></html>`;
            }

            function saveCode() {
                const code = editor.value;
                localStorage.setItem("codeline-code", code);
            }

            function refresh() {
                const code = editor.value;
                document.getElementById("outputted").srcdoc = getPageSource(code);
                saveCode();
            }

            window.addEventListener("load", () => {
                const savedCode = localStorage.getItem("codeline-code");
                if (savedCode !== null) {
                    editor.value = savedCode;
                    refresh();
                }
            });

            editor.addEventListener("input", (event) => {
                closeTagAfterInsertion(event.data);
                saveCode();
                document.getElementById("outputted").srcdoc = getPageSource(editor.value);
            });

            function create() {
                const win = window.open("about:blank", "_blank");
                if (!win) {
                    window.alert("The new tab was blocked. Allow pop-ups for this page, then try again.");
                    return;
                }

                const code = getPageSource(editor.value);
                win.document.open();
                win.document.write(code);
                win.document.close();
            }

            editor.addEventListener("paste", (event) => {
                const items = event.clipboardData?.items ?? [];
                if ([...items].some((item) => item.type.startsWith("image/"))) {
                    event.preventDefault();
                    console.warn("Image pasting disabled.");
                    return;
                }

                event.preventDefault();
                const text = event.clipboardData.getData("text/plain");
                editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, "end");
                editor.dispatchEvent(new InputEvent("input", {
                    bubbles: true,
                    inputType: "insertFromPaste",
                    data: text
                }));
            });
        </script>
        <script data-type="text/javascript">
            document.querySelectorAll('.sidebutton').forEach(btn => {
